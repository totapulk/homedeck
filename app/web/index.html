<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lights and vacuum control for one flat.">

  <!-- Added to a tablet's home screen, this should open without browser chrome. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeDeck">
  <meta name="theme-color" content="#101014">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HomeDeck</title>
  <link rel="manifest" href="manifest.json">

  <!-- The app's own background, painted before Flutter has loaded: without it a dark UI opens
       on a white flash. -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #101014; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
