name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant, so stop it
# instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore, build and test are separate steps so a failure names itself in the
      # job summary instead of hiding inside one long command.
      - name: Restore
        run: dotnet restore backend/HomeDeck.slnx

      - name: Build
        run: dotnet build backend/HomeDeck.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/HomeDeck.slnx --configuration Release --no-build --verbosity normal

  app:
    name: App analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Restore
        run: flutter pub get

      # The analyzer is not decoration here: it is the only thing standing between a typo and
      # a runtime failure on a device nobody is watching.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
