[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; NimBLE rather than the bundled Bluedroid stack: a fraction of the flash and RAM for a
; peripheral this small, which matters on a board that also has to stay responsive to an
; encoder's interrupts.
lib_deps = h2zero/NimBLE-Arduino@^2.1.0

build_flags = -DCORE_DEBUG_LEVEL=1
