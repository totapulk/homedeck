[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; NimBLE rather than the bundled Bluedroid stack: a fraction of the flash and RAM for a
; peripheral this small, which matters on a board that also has to stay responsive to two
; encoders' interrupts.
lib_deps = h2zero/NimBLE-Arduino@^2.1.0

; The Arduino core still defaults to gnu++11; the firmware uses if-with-initialiser and
; designated initialisers, both of which read better than the workarounds.
build_unflags = -std=gnu++11
build_flags = -DCORE_DEBUG_LEVEL=1 -std=gnu++17

[env:esp32dev]

; Wiring diagnostic: reports the raw level of every input as it changes, instead of decoded
; detents. Flash this when a newly wired knob does nothing and you need to know whether the
; problem is the wiring or the decoding.
;
;     pio run -e pindebug --target upload
;
[env:pindebug]
build_flags = ${env.build_flags} -DKNOB_PIN_DEBUG=1
